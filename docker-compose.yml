services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resume_verifier
      POSTGRES_USER: resume
      POSTGRES_PASSWORD: resume
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume -d resume_verifier"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    ports: ["5432:5432"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:///./resume_verifier.db
      CORS_ORIGINS: http://localhost:3000
      AUTH_SECRET: local-dev-secret-change-me
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  pgdata:
